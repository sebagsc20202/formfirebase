            // ===== CONFIGURACIÓN DE SERVICIOS =====
            let serviciosActuales = [];
            let nombreCampoActual = 'Servicio';

            async function loadServiceConfig() {
                try {
                    const doc = await db.collection('config').doc('servicios').get();
                    if (doc.exists) {
                        const data = doc.data();
                        serviciosActuales = data.lista || ['Consulta', 'Tatuaje', 'Piercing', 'Diseño'];
                        nombreCampoActual = data.nombreCampo || 'Servicio';
                    } else {
                        serviciosActuales = ['Consulta', 'Tatuaje', 'Piercing', 'Diseño'];
                        nombreCampoActual = 'Servicio';
                    }
                } catch (error) {
                    console.error('Error cargando configuración:', error);
                    serviciosActuales = ['Consulta', 'Tatuaje', 'Piercing', 'Diseño'];
                    nombreCampoActual = 'Servicio';
                }
            }

            function renderServiceList() {
                const container = document.getElementById('serviceListContainer');
                container.innerHTML = '';
                serviciosActuales.forEach((serv, index) => {
                    const div = document.createElement('div');
                    div.className = 'servicio-item';
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.value = serv;
                    input.dataset.index = index;
                    input.addEventListener('change', function() {
                        serviciosActuales[parseInt(this.dataset.index)] = this.value;
                    });
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn-remove';
                    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    removeBtn.title = 'Eliminar servicio';
                    removeBtn.addEventListener('click', function() {
                        serviciosActuales.splice(index, 1);
                        renderServiceList();
                    });
                    div.appendChild(input);
                    div.appendChild(removeBtn);
                    container.appendChild(div);
                });
                document.getElementById('serviceFieldName').value = nombreCampoActual;
            }

            window.addServiceItem = function() {
                const input = document.getElementById('newServiceInput');
                const value = input.value.trim();
                if (value) {
                    serviciosActuales.push(value);
                    input.value = '';
                    renderServiceList();
                } else {
                    alert('Ingresa un nombre de servicio válido.');
                }
            };

            window.openServiceModal = function() {
                loadServiceConfig().then(() => {
                    renderServiceList();
                    document.getElementById('serviceModal').classList.add('show');
                });
            };

            window.closeServiceModal = function() {
                document.getElementById('serviceModal').classList.remove('show');
            };

            document.getElementById('serviceForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const nombreCampo = document.getElementById('serviceFieldName').value.trim();
                if (!nombreCampo) {
                    alert('El nombre del campo es obligatorio.');
                    return;
                }
                // Actualizar lista desde los inputs (ya se actualizan con el evento change)
                // Pero para asegurar, leemos los valores actuales de los inputs
                const inputs = document.querySelectorAll('#serviceListContainer input');
                const lista = [];
                inputs.forEach(inp => {
                    const val = inp.value.trim();
                    if (val) lista.push(val);
                });
                if (lista.length === 0) {
                    alert('Debe haber al menos un servicio en la lista.');
                    return;
                }
                const submitBtn = document.getElementById('serviceSubmitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';
                try {
                    await db.collection('config').doc('servicios').set({
                        nombreCampo: nombreCampo,
                        lista: lista
                    });
                    alert('✅ Configuración de servicios guardada correctamente.');
                    closeServiceModal();
                    // Recargar la configuración en el formulario público no es necesario aquí, pero se actualizará al recargar la página.
                } catch (err) {
                    console.error(err);
                    alert('Error al guardar configuración. Verifica permisos.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Guardar Cambios';
                }
            });

            // Cerrar modal de servicios con ESC
            document.getElementById('serviceModal').addEventListener('click', function(e) {
                if (e.target === this) closeServiceModal();
            });
